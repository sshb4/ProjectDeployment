<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧳 Travel Memory Log</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Travel Memory Log</h1>
            <p>Capture your travel adventures</p>
        </div>

        <div class="main-content">
            <div class="form-section">
                <h2>Add New Memory</h2>
                <form id="memoryForm">
                    <div class="form-group">
                        <label for="travelMemory">Share your travel experience:</label>
                        <textarea 
                            id="travelMemory" 
                            name="message" 
                            class="form-control" 
                            placeholder="Where did you go? What did you see, eat, or experience? How did it make you feel? Share the details of your adventure..."
                            required
                            maxlength="2000"
                        ></textarea>
                            <span id="charCount">0</span>/2000 characters
                        </small>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span>📍 Log Memory</span>
                    </button>
                </form>
                <div id="statusMessage"></div>
            </div>

            <div class="messages-section">
                <h2>Travel Memories <span id="memoryCount">(0)</span></h2>
                <div id="messagesContainer" class="messages-container">
                    <div class="loading" id="loadingState">
                        Loading your travel memories...
                    </div>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
